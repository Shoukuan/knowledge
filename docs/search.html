<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>仓库搜索</title>
  <style>
    body{font-family:Segoe UI,Arial, sans-serif;padding:20px}
    input{width:100%;padding:10px;margin-bottom:10px}
    .result{padding:8px;border-bottom:1px solid #eee}
    .path{color:#666;font-size:0.9em}
    .meta{color:#444;font-size:0.9em;margin:4px 0}
    .pill{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:2px 8px;margin-right:6px;font-size:0.85em}
  </style>
<head>
<body>
  <h1>仓库文档搜索</h1>
  <input id="q" placeholder="输入关键字搜索标题、路径、标签、别名（回车）" />
  <div id="results"></div>

  <script>
    let index = [];
    fetch('search_index.json').then(r=>r.json()).then(j=>{ index=j; });
    const q = document.getElementById('q');
    const out = document.getElementById('results');
    function render(results){
      out.innerHTML = '';
      if(results.length===0){ out.innerHTML = '<p>无结果</p>'; return }
      for(const r of results.slice(0,200)){
        const d = document.createElement('div'); d.className='result';
        const tags = Array.isArray(r.tags) ? r.tags.map(t => `<span class='pill'>${t}</span>`).join('') : '';
        const type = r.type ? `<span class='pill'>${r.type}</span>` : '';
        d.innerHTML = `<div><a href='${r.path}'>${r.title || r.path}</a></div><div class='path'>${r.path}</div><div class='meta'>${type}${tags}</div><div>${r.snippet||''}</div>`;
        out.appendChild(d);
      }
    }
    q.addEventListener('keyup', (e)=>{ if(e.key==='Enter'){ doQuery(q.value) } });
    function doQuery(t){
      const s = t.trim().toLowerCase();
      if(!s){ render([]); return }
      const res = index
        .map(i => {
          const aliases = Array.isArray(i.aliases) ? i.aliases.join(' ') : '';
          const tags = Array.isArray(i.tags) ? i.tags.join(' ') : '';
          const haystack = `${i.title||''} ${i.path||''} ${i.type||''} ${aliases} ${tags}`.toLowerCase();
          let score = 0;
          if((i.title||'').toLowerCase().includes(s)) score += 5;
          if((i.path||'').toLowerCase().includes(s)) score += 3;
          if((i.type||'').toLowerCase().includes(s)) score += 2;
          if(tags.toLowerCase().includes(s)) score += 4;
          if(aliases.toLowerCase().includes(s)) score += 4;
          return haystack.includes(s) ? {...i, score} : null;
        })
        .filter(Boolean)
        .sort((a, b) => b.score - a.score || a.path.localeCompare(b.path, 'zh-CN'));
      render(res);
    }
  </script>
</body>
</html>
